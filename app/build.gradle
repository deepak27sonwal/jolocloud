plugins { id 'com.android.application' }

android {
    namespace 'com.cloudbackup.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.cloudbackup.app'
        minSdk 26
        targetSdk 34
        versionCode 8
        versionName '1.7'
    }
    signingConfigs {
        debug { enableV1Signing = true; enableV2Signing = true; enableV3Signing = true }
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
